name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v4.0.2)'
        required: true
        type: string
      package_version:
        description: 'Package version (e.g., 4.0.2)'
        required: true
        type: string
      upstream_version:
        description: 'Upstream source version'
        required: true
        default: '3.0.2'
        type: string
      create_draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:42

    outputs:
      tag: ${{ inputs.release_tag }}
      package_version: ${{ inputs.package_version }}

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-build

    - name: Create custom spec
      run: |
        cp pulseaudio-equalizer-ladspa.spec custom-build.spec
        sed -i "s/^Version:.*/Version:        ${{ inputs.package_version }}/" custom-build.spec
        sed -i "s|archive/v.*\.tar\.gz|archive/v${{ inputs.upstream_version }}.tar.gz|" custom-build.spec
        sed -i "s/%autosetup -n pulseaudio-equalizer-ladspa-.*/%autosetup -n equalizer-${{ inputs.upstream_version }}/" custom-build.spec
        DATE=$(date '+%a %b %d %Y')
        sed -i "/^%changelog/a\\
        * $DATE GitHub Actions <actions@github.com> - ${{ inputs.package_version }}-1\\
        - Manual build for tag ${{ inputs.release_tag }}\\
        " custom-build.spec

    - name: Download source
      run: |
        cd /github/home/rpmbuild/SOURCES/
        wget "https://github.com/pulseaudio-equalizer-ladspa/equalizer/archive/v${{ inputs.upstream_version }}.tar.gz" \
             -O "pulseaudio-equalizer-ladspa-${{ inputs.package_version }}.tar.gz"

    - name: Build RPM
      run: |
        cp custom-build.spec /github/home/rpmbuild/SPECS/
        dnf builddep -y /github/home/rpmbuild/SPECS/custom-build.spec
        cd /github/home/rpmbuild/SPECS/
        rpmbuild -ba custom-build.spec

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages-${{ inputs.release_tag }}
        path: /github/home/rpmbuild/RPMS/noarch/*.rpm
        retention-days: 30

  test-rpm:
    needs: build-rpm
    runs-on: ubuntu-latest
    container:
      image: fedora:42

    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: rpm-packages-${{ inputs.release_tag }}
        path: rpms/

    - name: Install runtime deps
      run: |
        dnf update -y
        dnf install -y glib2 gtk3 python3 python3-gobject ladspa-swh-plugins

    - name: Test RPM
      run: |
        rpm -i rpms/*.noarch.rpm
        rpm -ql pulseaudio-equalizer-ladspa

  create-release:
    needs: [build-rpm, test-rpm]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: rpm-packages-${{ inputs.release_tag }}
        path: rpms/

    - name: Create tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "${{ inputs.release_tag }}" -m "Manual release ${{ inputs.release_tag }}"
        git push origin "${{ inputs.release_tag }}"

    - name: Create release notes
      run: |
        cat > release_notes.md <<-EOF
        # PulseAudio Equalizer LADSPA ${{ inputs.release_tag }}

        Package Version: ${{ inputs.package_version }}
        Upstream Version: ${{ inputs.upstream_version }}
        Build Date: $(date -u)

        ## Installation
        \`\`\`bash
        sudo dnf install ./pulseaudio-equalizer-ladspa-${{ inputs.package_version }}-1.fc42.noarch.rpm
        \`\`\`
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.release_tag }}
        body_path: release_notes.md
        files: rpms/*.rpm
        draft: ${{ inputs.create_draft }}
        prerelease: ${{ contains(inputs.release_tag, 'beta') || contains(inputs.release_tag, 'alpha') || contains(inputs.release_tag, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
