name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:42

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-build

    - name: Extract version
      id: version
      run: |
        VERSION=$(rpmspec --query --queryformat '%{VERSION}\n' pulseaudio-equalizer-ladspa.spec)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Download source tarball
      run: |
        cd /github/home/rpmbuild/SOURCES/
        wget "https://github.com/pulseaudio-equalizer-ladspa/equalizer/archive/v${{ steps.version.outputs.VERSION }}.tar.gz" \
             -O "pulseaudio-equalizer-ladspa-${{ steps.version.outputs.VERSION }}.tar.gz"

    - name: Build RPM
      run: |
        cp pulseaudio-equalizer-ladspa.spec /github/home/rpmbuild/SPECS/
        dnf builddep -y /github/home/rpmbuild/SPECS/pulseaudio-equalizer-ladspa.spec
        cd /github/home/rpmbuild/SPECS/
        rpmbuild -ba pulseaudio-equalizer-ladspa.spec

    - name: Copy RPM packages
      run: |
        mkdir -p /github/workspace/rpms
        cp /github/home/rpmbuild/RPMS/noarch/*.rpm /github/workspace/rpms/
        cp /github/home/rpmbuild/SRPMS/*.rpm /github/workspace/rpms/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages-${{ steps.version.outputs.VERSION }}
        path: rpms/*.rpm
        retention-days: 30

    - name: Verify RPM
      run: |
        for rpm in /github/workspace/rpms/*.noarch.rpm; do
          rpm -qpi "$rpm"
          rpm -qpl "$rpm" | head -20
        done

  test-rpm:
    needs: build-rpm
    runs-on: ubuntu-latest
    container:
      image: fedora:42

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rpm-packages-${{ needs.build-rpm.outputs.version }}
        path: rpms/

    - name: Install runtime dependencies
      run: |
        dnf update -y
        dnf install -y ruby glib2 gtk3 python3 python3-gobject ladspa-swh-plugins

    - name: Test RPM installation
      run: |
        rpm -i rpms/*.noarch.rpm
        rpm -ql pulseaudio-equalizer-ladspa
        python3 -c "import sys; sys.path.insert(0, '/usr/lib/python3*/site-packages'); import pulseeq.pulse; print('Python module OK')"

  create-release:
    needs: [build-rpm, test-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: rpm-packages-${{ needs.build-rpm.outputs.version }}
        path: rpms/

    - name: Generate release notes
      id: notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        cat > release_notes.md <<-EOF
        # PulseAudio Equalizer LADSPA v${VERSION}

        ## Installation
        \`\`\`bash
        sudo dnf install ./pulseaudio-equalizer-ladspa-${VERSION}-1.fc42.noarch.rpm
        \`\`\`

        ## Features
        - 15-band graphic equalizer for PipeWire/PulseAudio
        - 26+ built-in audio presets
        - GTK3 interface with desktop integration

        **SHA256:**
        \`\`\`
        $(cd rpms && sha256sum *.rpm)
        \`\`\`
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release_notes.md
        files: rpms/*.rpm
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
